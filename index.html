<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="./style/style.css">
</head>
<body id="body" class="cyan">
    <!-- Top-Left Customize Box -->
    <section id="customizeSection">
        <div class="customize-label">Customize</div>
        <div class="customize-select-group">
            <select id="colorSelect">
                <option value="cyan">Cyan</option>
                <option value="blue">Blue</option>
                <option value="green">Green</option>
                <option value="purple">Purple</option>
                <option value="pink">Pink</option>
                <option value="red">Red</option>
            </select>
            <select id="clockType">
                <option value="24h">24h</option>
                <option value="12h">12h</option>
                <option value="sec">Seconds</option>
                <option value="min">Minimal</option>
            </select>
        </div>
    </section>

    <!-- Top-Right Settings Link -->
    <a id="editButton" href="./config.html" title="Configuration Settings">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
            <path d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z"/>
        </svg>
    </a>

    <main>
        <h1 id="clock"></h1>
        <h2 id="date"></h2>

        <div id="searchDiv">
            <input id="search" type="text" placeholder="Search with DuckDuckGo">
            <svg id="searchIcon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
                <path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/>
            </svg>
        </div>

        <div id="shortcuts"></div>

        <section id="todoSection">
            <h3>Quick Tasks</h3>
            <div id="todoInput">
                <input id="todoText" type="text" placeholder="Add a task...">
                <button id="todoAdd">+</button>
            </div>
            <ul id="todoList"></ul>
        </section>

        <div id="rssFeed"></div>
    </main>

    <script src="./script/main.js"></script>
</body>
</html>
